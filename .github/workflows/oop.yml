# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew
    
      - name: Execute Gradle build
        run: ./gradlew build

      - name: Generate Jacoco report
        run: ./gradlew jacocoTestReport

      - name: Locate Jacoco report and Javadoc folder
        run: |
          echo "Searching for jacoco report and javadoc folder"
          JACOCO=$(find "$GITHUB_WORKSPACE" -type f -name jacocoTestReport.xml | head -n 1 || true)
          if [ -n "$JACOCO" ]; then echo "JACOCO_PATH=$JACOCO" >> "$GITHUB_ENV"; else echo "JACOCO_PATH=" >> "$GITHUB_ENV"; fi
          JAVADOC_DIR=$(find "$GITHUB_WORKSPACE" -type d -path "*/build/docs/javadoc" | head -n 1 || true)
          if [ -n "$JAVADOC_DIR" ]; then echo "JAVADOC_FOLDER=$JAVADOC_DIR" >> "$GITHUB_ENV"; else echo "JAVADOC_FOLDER=" >> "$GITHUB_ENV"; fi

      - name: Check coverage and publish
        id: jacoco
        uses: madrapps/jacoco-report@v1.2
        with:
          paths: ${{ env.JACOCO_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Generate javadoc
        run: ./gradlew javadoc

      - name: Publish javadoc
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          folder: ${{ env.JAVADOC_FOLDER }}
          target-folder: ${{ github.head_ref }}

  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run check style
        uses: nikitasavinov/checkstyle-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: '.github/google_checks.xml'
          reporter: 'github-pr-check'
